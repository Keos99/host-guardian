server:
  port: 8099
  error:
    include-message: always

spring:
  datasource:
    url: jdbc:h2:file:./data/host-guardian;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: true
      path: /h2-console

notification:
  chat:
    # Master switch of the chat notification feature. When false, nothing is
    # sent and the dashboard hides all notification controls.
    enabled: true
    # Webhook endpoint that accepts {"peer", "status", "message", "url"} JSON
    # (the same payload shape as the legacy SberChat sender).
    # Leave blank to write messages to the application log only.
    url: ""
    # Recipient identifier sent as the "peer" payload field.
    peer: ""
    auth-header-name: Authorization
    auth-token: ""
    connect-timeout: 5s
    read-timeout: 10s

monitor:
  interval: 30s
  ssh:
    provider: system
    strict-host-key-checking: false
  command:
    process-lookup-timeout: 5s
    pid-check-timeout: 3s
    stop-timeout: 10s
    stop-command-extra-timeout: 2s
    restart-timeout: 20s
    start-timeout: 20s
    health-command-extra-timeout: 1s
    ssh-connect-timeout: 5s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
