spring:
  config:
    activate:
      on-profile: postgres

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/host_guardian}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:host_guardian}
    password: ${POSTGRES_PASSWORD:host_guardian}

  flyway:
    enabled: true

  h2:
    console:
      enabled: false

